# git-cliff configuration for GitHub release notes.
# release/RELEASE_NOTES.md is generated for publishing and is not committed.

[changelog]
header = """
# Changelog

All notable changes to this project are documented in this file.

The format is based on [Keep a Changelog](https://keepachangelog.com/en/1.0.0/),
and this project uses [Conventional Commits](https://www.conventionalcommits.org/).
"""
body = """
{% if version -%}
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else -%}
## [Unreleased]
{% endif -%}

{#- Each section lists its commits' subjects, then any matching
    Also-added / Also-changed / Also-fixed footers, so one commit that
    contains several inseparable changes can add one entry per change. -#}
{% for section in ["Added", "Changed", "Fixed"] -%}
{%- set footer_token = "also-" ~ section | lower -%}
{%- set_global entries = [] -%}
{%- for commit in commits -%}
{%- if commit.group == section -%}
{%- set scope = "" -%}{%- if commit.scope -%}{%- set scope = "*(" ~ commit.scope ~ ")* " -%}{%- endif -%}
{%- set_global entries = entries | concat(with=scope ~ commit.message | split(pat="\n") | first | upper_first | trim) -%}
{%- endif -%}
{%- for footer in commit.footers | default(value=[]) -%}
{%- if footer.token | lower == footer_token -%}
{%- set_global entries = entries | concat(with=footer.value | upper_first | trim) -%}
{%- endif -%}
{%- endfor -%}
{%- endfor -%}
{%- if entries | length > 0 %}
### {{ section }}
{% for entry in entries %}
- {{ entry }}
{% endfor %}
{%- endif -%}
{%- endfor %}
"""
trim = true

[git]
conventional_commits = true
filter_unconventional = false
filter_commits = false
sort_commits = "oldest"

commit_parsers = [
  { message = '^feat(\([^)]*\))?!?:', group = "Added" },
  { message = '^fix(\([^)]*\))?!?:', group = "Fixed" },
  { message = '^(change|perf)(\([^)]*\))?!?:', group = "Changed" },
  # Use change: for maintenance that deserves a user-facing release note.
  { message = '^(refactor|docs|test|build|ci|chore)(\([^)]*\))?:', skip = true },
  { message = '^revert(\([^)]*\))?!?:', group = "Changed" },
  { message = "^.*", group = "Changed" },
]
